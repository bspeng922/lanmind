name: Release & Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test macOS release checks
        run: python3 -m unittest discover -s lanmind/scripts -p test_verify_macos_release.py -v

      - name: Validate Apple release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 lanmind/scripts/verify-macos-release.py credentials --optional

      - name: Prepare draft release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: |
            ## LanMind

            本地优先的局域网协作桌面应用，提供任务、项目、Wiki、AI 助手、聊天、文件传输、桌面日历和插件。

            - 任务支持自定义状态、循环排期、子任务、提醒和回收站。
            - Wiki 支持文档树、版本历史、AI 润色、大纲导航、公式与图表。
            - AI 支持多模型连接、OpenAI / Anthropic 兼容接口、工具调用、文件授权和 MCP。
            - 局域网聊天支持广播、单聊、群组、图片、文件和桌面截图。
            - 网页插件通过签名 `.lmpk` 包本地导入或从局域网插件市场安装。
            - 密码库支持独立主密码、密码生成、加密备份和一对一分享。
            - 提供 Windows 和 Linux 安装包；macOS 支持从源码构建。

            功能、安装与使用说明见 [README.md](https://github.com/bspeng922/lanmind/blob/main/README.md)。
        with:
          script: |
            const fs = require('node:fs');
            const config = JSON.parse(fs.readFileSync('lanmind/src-tauri/tauri.conf.json', 'utf8'));
            const tag = `v${config.version}`;
            if (context.ref !== `refs/tags/${tag}`) {
              throw new Error(`Release builds must run on the version tag ${tag}; select that tag for workflow_dispatch.`);
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`Release ${tag} is already published; create a new version instead of replacing its assets.`);
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: `LanMind ${tag}`, body: process.env.RELEASE_BODY,
                draft: true, prerelease: false, generate_release_notes: true,
              })).data;
            }
            core.setOutput('release_id', String(release.id));

  build-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './lanmind/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libgbm-dev libdrm-dev libegl-dev libegl1-mesa-dev libclang-dev
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Install frontend dependencies
        working-directory: ./lanmind
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: ./lanmind
          tauriScript: 'npm run tauri'
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS signatures, notarization, and packaged app
        if: runner.os == 'macOS'
        working-directory: ./lanmind
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_BUNDLE_DIRECTORY: src-tauri/target/${{ matrix.target }}/release/bundle
        run: python3 scripts/verify-macos-release.py verify "$MACOS_BUNDLE_DIRECTORY" --optional

  publish-release:
    needs: [prepare-release, build-tauri]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('Invalid draft release ID');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: release } = await github.rest.repos.getRelease({ ...repo, release_id: releaseId });
            if (!release.draft || context.ref !== `refs/tags/${release.tag_name}`) {
              throw new Error('The release no longer matches the draft for this version tag');
            }
            await github.rest.repos.updateRelease({ ...repo, release_id: releaseId, draft: false });
