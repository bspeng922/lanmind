name: Release & Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './lanmind/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libgbm-dev libdrm-dev libegl-dev libegl1-mesa-dev libclang-dev
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Install frontend dependencies
        working-directory: ./lanmind
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./lanmind
          tauriScript: 'npm run tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'LanMind v__VERSION__'
          releaseBody: |
            ## 本次版本更新

            `v0.2.0` 聚焦国际化、聊天协作效率、桌面端可用性和跨平台回归验证。

            - 支持简体中文、英文和跟随系统，覆盖主窗口、附属窗口、托盘、网络访问和离线接收端。
            - 新增桌面聊天截图：框选、复制到剪贴板、另存为 PNG、隐藏主窗口截图，并可直接粘贴发送。
            - 群聊支持 `@` 成员提醒；任务详情支持上下条目切换和统一的更多操作菜单。
            - 优化任务排序筛选、日历和看板布局、关闭按钮行为、自动锁定、网络伺服及多显示器窗口定位。
            - 工作汇报排除已放弃任务，补充国际化、截图、窗口行为和聊天交互回归测试。

            完整变更记录见 [CHANGELOG.md](https://github.com/bspeng922/lanmind/blob/main/CHANGELOG.md)。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
