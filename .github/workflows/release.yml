name: Release & Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './lanmind/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libgbm-dev libdrm-dev libegl-dev libegl1-mesa-dev libclang-dev
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Install frontend dependencies
        working-directory: ./lanmind
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./lanmind
          tauriScript: 'npm run tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'LanMind v__VERSION__'
          releaseBody: |
            ## 本次版本更新

            `v0.2.1` 聚焦统一工作台、Wiki 知识库重构、多模型本地智能体 (AI Agent)、项目协作分栏升级、数据清理与任务回收站体验。

            - **统一工作台与全局快捷键**：新增全局模块导航、`Ctrl/Cmd+K` 命令面板及上下文抽屉，支持模块快捷切换。
            - **Wiki 知识库重构**：页面树、Notion/Obsidian 风格排版、Draft 缓存流畅编辑、版本历史与恢复、全量 ZIP 导出。
            - **多模型与本地智能体 (Agent)**：支持 Ollama/vLLM/SGLang/OpenAI 兼容接口，工具循环、目录授权、结构化追问卡片 (Ask User) 与任务/Wiki 转化。
            - **项目协作与组织架构**：成员管理与组织架构左右分栏、一键全选/折叠，群组关联协作项目并一键同步成员。
            - **现代任务卡片与列表自适应**：任务编号、状态胶囊、优先级、排期、独立子任务与附件内联打卡，紧凑/标准密度自适应。
            - **任务回收站与安全防误删**：删除任务统一确认弹窗，删除后自动进入回收站保留 30 天，支持单项与整组恢复。
            - **系统设置与本地数据清理**：支持任务/Wiki/聊天/AI 对话分类安全清理，具备防误触二次确认与工作区范围选择。

            完整变更记录见 [CHANGELOG.md](https://github.com/bspeng922/lanmind/blob/main/CHANGELOG.md)。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
