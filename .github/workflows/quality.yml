name: Quality
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lanmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lanmind/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run lint:all
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: python3 -m unittest discover -s scripts -p test_verify_macos_release.py
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libgbm-dev libdrm-dev libegl-dev libegl1-mesa-dev libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lanmind/src-tauri
      - run: cargo test --manifest-path lanmind/src-tauri/Cargo.toml --locked --lib
  rust-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lanmind/src-tauri
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: node lanmind/scripts/check-rust-advisories.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lanmind
    env:
      DISABLE_HMR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lanmind/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx playwright install --with-deps chromium
      - run: npm run test:theme -- --workers=2
      - run: npm run test:optical:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: lanmind/test-results
